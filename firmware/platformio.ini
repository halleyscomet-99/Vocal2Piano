; Vocal2Piano firmware: Teensy 4.1 on the C0nTrollER board.
; Build and upload: pio run -t upload    Serial monitor: pio device monitor
[platformio]
; Outside iCloud sync (folders ending in .nosync are skipped) and git-ignored.
build_dir = .pio.nosync/build
libdeps_dir = .pio.nosync/libdeps

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DUSB_SERIAL
lib_deps =
    waspinator/AccelStepper @ ^1.64
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
monitor_speed = 115200
